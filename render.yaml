databases:
  - name: deployhub-db
    databaseName: deployhub
    user: deployhub
    plan: free
    region: singapore

services:
  - type: web
    name: deployhub
    runtime: node
    plan: free
    region: singapore
    branch: swati165-deployhub-mvp
    rootDir: deployflow-frontend-main
    buildCommand: npm ci && npm run build
    startCommand: npm run server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: deployhub-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
